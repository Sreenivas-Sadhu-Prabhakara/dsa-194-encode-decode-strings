<text x="56.0" y="315.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Decode: parse digits to '#', slice exactly that many bytes, repeat. Words like ":"</text>
<text x="56.0" y="334.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">or "4#" pass through untouched — the framing is what TCP, Protobuf and Redis all do.</text>
